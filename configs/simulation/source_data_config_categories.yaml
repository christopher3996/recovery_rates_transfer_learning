n_samples: 8000
seed: 42

recovery_rate:
  parameters:
    secured_p: 0.7
    secured_peak:
      mean: 0.65
      std: 0.15
    unsecured_peak:
      mean: 0.0
      std: 0.05

features:
  Feature_1:
    shiftable: true
    relationship_type: "linear"
    parameters:
      beta: 1.0
      intercept: 0.0
      noise_std: 0.8
      skewness: 0.0

  Feature_2:
    shiftable: true
    relationship_type: "nonlinear"
    parameters:
      function: "sin"
      beta: 1.5
      intercept: -2.5
      noise_std: 0.5
      skewness: -0.5

  Feature_3:
    shiftable: true
    relationship_type: "nonlinear"
    parameters:
      function: "polynomial"
      degree: 3
      beta: 1.0
      intercept: 0.0
      noise_std: 0.4
      skewness: 0.5

  Feature_4:
    shiftable: true
    relationship_type: "nonlinear"
    parameters:
      function: "exp"
      beta: 0.2
      intercept: 0.6
      noise_std: 0.4
      skewness: 0.2

  Feature_5:
    shiftable: true
    relationship_type: "nonlinear"
    parameters:
      function: "sigmoid"
      beta: 1.0
      intercept: 5.0
      k: 10
      x0: 0.5
      noise_std: 0.7
      skewness: 0.8
      
  Feature_6:
    shiftable: true
    relationship_type: "custom"
    parameters:
      function: !!python/object/apply:builtins.eval
        args: ["lambda rr: np.square(rr)"]
      beta: 1.0
      intercept: 0.0
      noise_std: 0.4
      skewness: 0.0

  Feature_7:
    shiftable: true
    relationship_type: "custom"
    parameters:
      function: !!python/object/apply:builtins.eval
          args: ["lambda rr: np.sin(rr * 8) + 0.2*np.log(rr + 1e-4) + 0.5*np.random.normal(0,1,len(rr))"]
      beta: 1.5
      intercept: 2
      noise_std: 0.8
      skewness: -0.4


  Feature_Interaction:
    shiftable: true
    relationship_type: "interaction"
    parameters:
      function: "multiply"
      features: ["Feature_1", "Feature_2"]
      noise_std: 0.1

  Borrower_Industry:
    shiftable: false          
    relationship_type: "categorical_softmax"
    parameters:
      categories: ["Manufacturing","Retail","Technology","Energy","Healthcare"]
      # logits = w0 + w1*rr + w2*rr^2 + w3*secured   (vector per category)
      weights:
        Manufacturing: [  2.0, -3.0,  0.0,  0.0]
        Retail:        [  1.5, -1.5,  1.0,  0.5]
        Technology:    [  0.5,  2.0, -1.5, -0.5]
        Energy:        [ -1.0,  3.0, -2.0,  1.0]
        Healthcare:    [ -2.0,  0.0,  3.0, -1.0]
      noise_temperature: 0.30   # σ of N(0,σ) added to *every* logit
